<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get PeakWait on iPhone or Android</title>
<meta name="description" content="PeakWait: live ski lift waits at 116 resorts, from skiers on the mountain. Free on iPhone and Android.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://peakwait.net/">
<link rel="icon" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PeakWait">
<meta property="og:title" content="PeakWait: Ski the mountain, skip the wait">
<meta property="og:description" content="Live lift waits at 116 resorts, from skiers on the mountain. Free on iPhone and Android.">
<meta property="og:url" content="https://peakwait.net/app">
<meta property="og:image" content="https://peakwait.net/og.png">
<style>
  :root{ --bg:#070f16; --ink:#eff4f9; --ink2:#adb9c4; --ink3:#7d8b97; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
        font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align:center; padding:32px 16px; box-sizing:border-box; }
  .icon{ width:72px; height:72px; border-radius:16px; }
  h1{ margin:16px 0 4px; font-size:1.6rem; line-height:1.2; }
  p{ margin:0; color:var(--ink2); }
  .stores{ margin-top:28px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:16px; }
  .stores a{ display:inline-block; line-height:0; }
  .stores .as img{ height:54px; width:auto; }
  /* Google's image carries its own empty margin; the negative margin lines the badge itself up with the App Store one. */
  .stores .gp img{ height:80px; width:auto; margin:-11px -13px; }
  .legal{ margin-top:32px; font-size:.75rem; color:var(--ink3); }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LJ4V6MDP0Y"></script>
<script>
// Short link for bios and posts. It counts the visit, then sends an iPhone to the App Store and an
// Android phone to Google Play. On anything else the skier picks a store.
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
var APPLE = 'https://apps.apple.com/app/peakwait/id6793253589';
var PLAY = 'https://play.google.com/store/apps/details?id=com.peakwait.app';
var ua = navigator.userAgent || '';
var PHONE = /Android/i.test(ua) ? 'android' : (/iPhone|iPad|iPod/i.test(ua) ? 'iphone' : '');
var STORE = PHONE === 'android' ? PLAY : (PHONE === 'iphone' ? APPLE : '');
var sent = false;
function go(){ if (STORE && !sent) { sent = true; location.replace(STORE); } }
gtag('config', 'G-LJ4V6MDP0Y', STORE ? { event_callback: go, event_timeout: 1000 } : {});
if (STORE) setTimeout(go, 1200);
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('.stores a'); if (!a) return;
  gtag('event', a.className === 'gp' ? 'google_play_click' : 'app_store_click', { from: 'app' });
});
</script>
</head>
<body>
<main>
  <img class="icon" src="/icon-192.png" alt="PeakWait">
  <h1 id="say">Get PeakWait</h1>
  <p id="sub">Free on iPhone and Android. Pick your phone.</p>
  <div class="stores">
    <a class="as" href="https://apps.apple.com/app/peakwait/id6793253589" aria-label="Download PeakWait on the App Store"><img src="/assets/img/appstore-badge.svg" alt="Download on the App Store" width="162" height="54"></a>
    <a class="gp" href="https://play.google.com/store/apps/details?id=com.peakwait.app" aria-label="Get PeakWait on Google Play"><img src="/assets/img/google-play-badge.png" alt="Get it on Google Play" width="207" height="80"></a>
  </div>
  <p class="legal">Google Play and the Google Play logo are trademarks of Google LLC.</p>
</main>
<script>
if (PHONE) {
  document.getElementById('say').textContent = PHONE === 'android' ? 'Opening Google Play…' : 'Opening the App Store…';
  document.getElementById('sub').textContent = 'Not opening? Pick your store.';
}
</script>
</body>
</html>
