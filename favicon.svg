<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081120"/>
      <stop offset="38%" stop-color="#112A46"/>
      <stop offset="72%" stop-color="#1C3E5A"/>
      <stop offset="100%" stop-color="#2B4A5E"/>
    </linearGradient>
    <radialGradient id="pw-glow" cx="0.5" cy="0.72" r="0.62">
      <stop offset="0%" stop-color="#FFCF63" stop-opacity="0.92"/>
      <stop offset="26%" stop-color="#F6990F" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#DB5A0C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#DB5A0C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pw-gold" x1="26" y1="18" x2="74" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF1D2"/>
      <stop offset="30%" stop-color="#FFCB5C"/>
      <stop offset="64%" stop-color="#F6A526"/>
      <stop offset="100%" stop-color="#DE7A10"/>
    </linearGradient>
    <linearGradient id="pw-ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1D31"/>
      <stop offset="100%" stop-color="#08131F"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#pw-sky)"/>
  <rect width="100" height="100" rx="22" fill="url(#pw-glow)"/>

  <!-- mountain ridge -->
  <path d="M0,82 L20,74 L36,78 L52,70 L70,76 L86,71 L100,77 L100,101 L0,101 Z" fill="url(#pw-ridge)"/>

  <!-- chairlift: cable arc, hanger, chair, skier — bold enough to read at 16px -->
  <g fill="none" stroke="url(#pw-gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10,24 Q50,35 90,24" stroke-width="4"/>
    <path d="M50,31 L49,47" stroke-width="4.4"/>
    <path d="M42,46 L42,70 L70,70" stroke-width="6.6"/>
    <path d="M40,78 L74,76.5" stroke-width="5.2"/>
  </g>
  <circle cx="50" cy="30" r="3.6" fill="url(#pw-gold)"/>

  <!-- seated skier -->
  <g fill="url(#pw-gold)">
    <circle cx="56" cy="52" r="6.6"/>
    <path d="M49.5,59 C47.4,63 47.6,67.6 48.6,71 L63,71 C64,67.2 63.6,62.4 61.6,59 C58.8,56.4 52.3,56.4 49.5,59 Z"/>
  </g>
</svg>
